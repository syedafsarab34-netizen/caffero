services:
  - type: web
    name: caffero
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CAFFERO_ORIGIN
        fromService:
          type: web
          name: caffero
          envVarKey: RENDER_EXTERNAL_URL
      - key: CAFFERO_DATABASE
        value: /tmp/caffero.sqlite
      - key: CAFFERO_UPLOADS_DIRECTORY
        value: /tmp/caffero-uploads
      - key: CAFFERO_TRUST_PROXY
        value: "true"
      - key: CAFFERO_SESSION_SECRET
        generateValue: true
      - key: CAFFERO_ADMIN_EMAIL
        sync: false
      - key: CAFFERO_ADMIN_PASSWORD
        sync: false
